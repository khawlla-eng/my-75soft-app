<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تتبع التمارين والقياسات</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --bg-color: #F4F7F6;
      --card-bg: #FFFFFF;
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    h2 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      flex: 1;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background-color: #888;
    }

    button.success {
      background-color: #28a745;
    }

    .loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      color: white;
      text-align: center;
      padding-top: 200px;
      font-size: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body>

<div class="container">
  <form id="trackerForm">
    
    <!-- Page 1: القياسات والأسبوع -->
    <div id="page1" class="page active">
      <h2>الصفحة 1: القياسات والجرعة</h2>
      
      <div class="form-group">
        <label for="weekNumber">الأسبوع:</label>
        <input type="text" id="weekNumber" name="weekNumber" placeholder="مثال: الأسبوع 1">
      </div>

      <div class="form-group">
        <label for="weeklyWeight">الوزن الأسبوعي (كجم):</label>
        <input type="number" step="0.1" id="weeklyWeight" name="weeklyWeight" placeholder="مثال: 65.5">
      </div>

      <div class="form-group">
        <label for="cyclePhase">الحالة الهرمونية / الدورة:</label>
        <input type="text" id="cyclePhase" name="cyclePhase" placeholder="أدخلي الحالة الهرمونية">
      </div>

      <div class="form-group">
        <label for="doseTaken">أخذ الجرعة؟</label>
        <select id="doseTaken" name="doseTaken">
          <option value="نعم">نعم</option>
          <option value="لا">لا</option>
        </select>
      </div>

      <div class="form-group">
        <label for="doseLocation">تفاصيل / مكان الجرعة:</label>
        <input type="text" id="doseLocation" name="doseLocation" placeholder="مثال: البطن - 0.5 ملغ">
      </div>

      <div class="form-group">
        <label for="weeklyChanges">تغيرات الأسبوع:</label>
        <textarea id="weeklyChanges" name="weeklyChanges" rows="2" placeholder="أي أعراض أو ملاحظات..."></textarea>
      </div>

      <div class="form-group">
        <label for="waterIntake">كمية الماء (لتر):</label>
        <input type="number" step="0.1" id="waterIntake" name="waterIntake" placeholder="مثال: 2.5">
      </div>

      <div class="form-group">
        <label for="dietCommitment">الالتزام بالأكل والبروتين:</label>
        <input type="text" id="dietCommitment" name="dietCommitment" placeholder="ممتاز / متوسط">
      </div>

      <div class="btn-group">
        <button type="button" class="success" onclick="sendData()">حفظ وإرسال الصفحة 1</button>
        <button type="button" onclick="nextPage()">التالي (التمرين) ➔</button>
      </div>
    </div>

    <!-- Page 2: التمارين اليومية -->
    <div id="page2" class="page">
      <h2>الصفحة 2: التمرين اليومي</h2>

      <div class="form-group">
        <label for="dayOfWeek">اليوم:</label>
        <select id="dayOfWeek" name="dayOfWeek">
          <option value="الأحد">الأحد</option>
          <option value="الإثنين">الإثنين</option>
          <option value="الثلاثاء">الثلاثاء</option>
          <option value="الأربعاء">الأربعاء</option>
          <option value="الخميس">الخميس</option>
          <option value="الجمعة">الجمعة</option>
          <option value="السبت">السبت</option>
        </select>
      </div>

      <div class="form-group">
        <label for="workoutType">نوع التمرين:</label>
        <input type="text" id="workoutType" name="workoutType" placeholder="مثال: الجزء العلوي / رجلين">
      </div>

      <div class="form-group">
        <label for="exerciseSelect">اسم التمرين:</label>
        <input type="text" id="exerciseSelect" name="exerciseSelect" placeholder="مثال: Shoulder Press">
      </div>

      <div class="form-group">
        <label for="setWeight">الوزن المرفوع (kg):</label>
        <input type="number" step="0.5" id="setWeight" name="setWeight">
      </div>

      <div class="form-group">
        <label for="setReps">العدات (Reps):</label>
        <input type="number" id="setReps" name="setReps">
      </div>

      <div class="form-group">
        <label for="cardioDevice">جهاز الكارديو:</label>
        <input type="text" id="cardioDevice" name="cardioDevice" placeholder="Treadmill / Bike / لا يوجد">
      </div>

      <div class="form-group">
        <label for="cardioDuration">مدة الكارديو (دقائق):</label>
        <input type="number" id="cardioDuration" name="cardioDuration">
      </div>

      <div class="form-group">
        <label for="cardioCalories">السعرات الحرارية:</label>
        <input type="number" id="cardioCalories" name="cardioCalories">
      </div>

      <div class="form-group">
        <label for="cardioBpm">ضربات القلب (BPM):</label>
        <input type="number" id="cardioBpm" name="cardioBpm">
      </div>

      <div class="form-group">
        <label for="cardioSpeed">السرعة:</label>
        <input type="number" step="0.1" id="cardioSpeed" name="cardioSpeed">
      </div>

      <div class="form-group">
        <label for="extraActivity">نشاط إضافي / كلاسات:</label>
        <input type="text" id="extraActivity" name="extraActivity" placeholder="مشاة / بيلاتس...">
      </div>

      <div class="form-group">
        <label for="extraTime">وقت النشاط الإضافي:</label>
        <input type="text" id="extraTime" name="extraTime">
      </div>

      <div class="form-group">
        <label for="extraDuration">مدة النشاط الإضافي (دقائق):</label>
        <input type="number" id="extraDuration" name="extraDuration">
      </div>

      <div class="btn-group">
        <button type="button" class="secondary" onclick="prevPage()">➔ السابق</button>
        <button type="button" class="success" onclick="sendData()">حفظ وإرسال الكل</button>
      </div>
    </div>

  </form>
</div>

<div id="loadingOverlay" class="loading-overlay">جاري إرسال البيانات إلى Google Sheets...</div>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycby0XUNLUQoEWmmpflLAOqLUjg4Z1zbcLcSHotl-mxu0fCla64nKSwIEppMLWymKmJeO8g/exec';

  function nextPage() {
    document.getElementById('page1').classList.remove('active');
    document.getElementById('page2').classList.add('active');
    window.scrollTo(0, 0);
  }

  function prevPage() {
    document.getElementById('page2').classList.remove('active');
    document.getElementById('page1').classList.add('active');
    window.scrollTo(0, 0);
  }

  function sendData() {
    const loading = document.getElementById('loadingOverlay');
    const form = document.getElementById('trackerForm');
    
    loading.style.display = 'block';

    const formData = new FormData(form);
    const searchParams = new URLSearchParams();

    for (const pair of formData.entries()) {
      searchParams.append(pair[0], pair[1]);
    }

    fetch(scriptURL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: searchParams.toString()
    })
    .then(() => {
      loading.style.display = 'none';
      alert('تم إرسال البيانات بنجاح إلى Google Sheets!');
      form.reset();
      prevPage();
    })
    .catch(error => {
      loading.style.display = 'none';
      alert('حدث خطأ أثناء الإرسال: ' + error.message);
    });
  }
</script>

</body>
</html>

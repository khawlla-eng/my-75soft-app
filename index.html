<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق تتبع القياسات والتمارين</title>
  <style>
    :root {
      --primary: #4A90E2;
      --success: #28a745;
      --secondary: #6c757d;
      --bg: #f4f7f6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .app-card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    h2 {
      color: var(--primary);
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: #444;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      background-color: #fafafa;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #fff;
    }

    /* منطقة الأزرار في الأسفل */
    .buttons-container {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .btn-primary { background-color: var(--primary); color: white; }
    .btn-success { background-color: var(--success); color: white; }
    .btn-secondary { background-color: var(--secondary); color: white; }

    .btn:active { opacity: 0.8; }

    .loading-screen {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      color: white;
      text-align: center;
      padding-top: 220px;
      font-size: 18px;
      font-weight: bold;
      z-index: 9999;
    }
  </style>
</head>
<body>

<div class="app-card">
  <form id="mainForm">
    
    <!-- الصفحة الأولى -->
    <div id="page1" class="page active">
      <h2>1️⃣ القياسات والجرعة الأسبوعية</h2>

      <div class="form-group">
        <label>الأسبوع:</label>
        <input type="text" name="weekNumber" placeholder="مثال: الأسبوع 1">
      </div>

      <div class="form-group">
        <label>الوزن الأسبوعي (كجم):</label>

        <input type="number" step="0.1" name="weeklyWeight" placeholder="مثال: 65.5">
      </div>

      <div class="form-group">
        <label>الحالة الهرمونية / الدورة:</label>
        <input type="text" name="cyclePhase" placeholder="أدخلي الحالة الهرمونية">
      </div>

      <div class="form-group">
        <label>أخذ الجرعة؟</label>
        <select name="doseTaken">
          <option value="نعم">نعم</option>
          <option value="لا">لا</option>
        </select>
      </div>

      <div class="form-group">
        <label>مكان وتفاصيل الجرعة:</label>
        <input type="text" name="doseLocation" placeholder="مثال: البطن - 0.5 ملغ">
      </div>

      <div class="form-group">
        <label>تغيرات وملاحظات الأسبوع:</label>
        <textarea name="weeklyChanges" rows="2" placeholder="أي الأعراض أو ملاحظات..."></textarea>
      </div>

      <div class="form-group">
        <label>كمية الماء (لتر):</label>
        <input type="number" step="0.1" name="waterIntake" placeholder="مثال: 2.5">
      </div>

      <div class="form-group">
        <label>الالتزام بالأكل والبروتين:</label>
        <input type="text" name="dietCommitment" placeholder="ممتاز / متوسط">
      </div>

      <!-- الأزرار بأسفل الصفحة الأولى -->
      <div class="buttons-container">
        <button type="button" class="btn btn-success" onclick="submitData()">💾 حفظ وإرسال البيانات</button>
        <button type="button" class="btn btn-primary" onclick="showPage('page2')">الانتقال للتمرين ➔</button>
      </div>
    </div>

    <!-- الصفحة الثانية -->
    <div id="page2" class="page">
      <h2>2️⃣ بيانات التمرين اليومي</h2>

      <div class="form-group">
        <label>اليوم:</label>
        <select name="dayOfWeek">
          <option value="الأحد">الأحد</option>
          <option value="الإثنين">الإثنين</option>
          <option value="الثلاثاء">الثلاثاء</option>
          <option value="الأربعاء">الأربعاء</option>
          <option value="الخميس">الخميس</option>
          <option value="الجمعة">الجمعة</option>
          <option value="السبت">السبت</option>
        </select>
      </div>

      <div class="form-group">
        <label>نوع التمرين:</label>
        <input type="text" name="workoutType" placeholder="مثال: الجزء العلوي / رجلين">
      </div>

      <div class="form-group">
        <label>اسم التمرين:</label>
        <input type="text" name="exerciseSelect" placeholder="مثال: Shoulder Press">
      </div>

      <div class="form-group">
        <label>الوزن المرفوع (kg):</label>
        <input type="number" step="0.5" name="setWeight">
      </div>

      <div class="form-group">
        <label>العدات (Reps):</label>
        <input type="number" name="setReps">
      </div>

      <div class="form-group">
        <label>جهاز الكارديو:</label>
        <input type="text" name="cardioDevice" placeholder="Treadmill / Bike / لا يوجد">
      </div>

      <div class="form-group">
        <label>مدة الكارديو (دقائق):</label>
        <input type="number" name="cardioDuration">
      </div>

      <div class="form-group">
        <label>السعرات الحرارية:</label>
        <input type="number" name="cardioCalories">
      </div>

      <div class="form-group">
        <label>ضربات القلب (BPM):</label>
        <input type="number" name="cardioBpm">
      </div>

      <div class="form-group">
        <label>السرعة:</label>
        <input type="number" step="0.1" name="cardioSpeed">
      </div>

      <div class="form-group">
        <label>نشاط إضافي / كلاسات:</label>
        <input type="text" name="extraActivity" placeholder="مشاة / بيلاتس...">
      </div>

      <div class="form-group">
        <label>وقت النشاط الإضافي:</label>
        <input type="text" name="extraTime">
      </div>

      <div class="form-group">
        <label>مدة النشاط الإضافي (دقائق):</label>
        <input type="number" name="extraDuration">
      </div>

      <!-- الأزرار بأسفل الصفحة الثانية -->
      <div class="buttons-container">
        <button type="button" class="btn btn-secondary" onclick="showPage('page1')">➔ العودة للقياسات</button>
        <button type="button" class="btn btn-success" onclick="submitData()">💾 حفظ وإرسال البيانات</button>
      </div>
    </div>

  </form>
</div>

<div id="loader" class="loading-screen">جاري إرسال البيانات إلى Google Sheets...</div>

<script>
  // رابط Web App الخاص بك في Google Apps Script
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby0XUNLUQoEWmmpflLAOqLUjg4Z1zbcLcSHotl-mxu0fCla64nKSwIEppMLWymKmJeO8g/exec';

  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo(0, 0);
  }

  function submitData() {
    const loader = document.getElementById('loader');
    const form = document.getElementById('mainForm');
    
    loader.style.display = 'block';

    const formData = new FormData(form);
    const params = new URLSearchParams();

    for (const [key, value] of formData.entries()) {
      params.append(key, value);
    }

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: params.toString()
    })
    .then(() => {
      loader.style.display = 'none';
      alert('✅ تم حفظ وإرسال البيانات بنجاح في Google Sheets!');
      form.reset();
      showPage('page1');
    })
    .catch(err => {
      loader.style.display = 'none';
      alert('❌ حدث خطأ في التواصل: ' + err.message);
    });
  }
</script>

</body>
</html>
